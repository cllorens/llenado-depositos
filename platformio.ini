; Medidor de llenado de depositos IBC de 1000 L
; Seeed XIAO ESP32-C6 + sensor ultrasonico DFRobot A02YYUW -> MQTT -> Home Assistant
;
; El ESP32-C6 necesita Arduino 3.x: la plataforma oficial "espressif32" (6.x) no lo soporta,
; se usa la de pioarduino.
;
; Un entorno por deposito (cambia nombre, hostname y topics MQTT). Para anadir otro, copiar un bloque
; y cambiar DEPOSITO_NUM.
;   pio run -e deposito1 -t upload            (por USB)
;   pio run -e deposito1_ota -t upload        (por WiFi: en modo depuracion o con "Mantenimiento" en HA)

[env]
; 54.03.21 = Arduino 3.2.1. La version "stable" (61.x) exige tener Git instalado.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
; Su esptool 5.0.0-dev1 falla con click >= 8.2 ("get_metavar() missing ... 'ctx'"): en el Python
; de PlatformIO hace falta click 8.1.8:
;   & "$env:USERPROFILE\.platformio\penv\Scripts\python.exe" -m pip install click==8.1.8
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7

[env:deposito1]
build_flags = ${env.build_flags} -DDEPOSITO_NUM=1

[env:deposito1_ota]
extends = env:deposito1
upload_protocol = espota
upload_port = Deposito-1.local   ; DHCP: nombre mDNS (o poner la IP que sale en el log)

[env:deposito2]
build_flags = ${env.build_flags} -DDEPOSITO_NUM=2

[env:deposito2_ota]
extends = env:deposito2
upload_protocol = espota
upload_port = Deposito-2.local
